<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackwood RPG</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    image-rendering: pixelated;
}

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
}

#stats {
    position: absolute;
    top: 15px;
    left: 15px;
    width: 230px;
    padding: 12px;
    background: rgba(0,0,0,.65);
    border: 2px solid rgba(255,255,255,.15);
    border-radius: 8px;
}

.bar {
    width: 100%;
    height: 14px;
    background: #333;
    margin: 5px 0 8px;
    border-radius: 4px;
    overflow: hidden;
}

#hpBar {
    height: 100%;
    background: #d63b3b;
    width: 100%;
}

#xpBar {
    height: 100%;
    background: #3d8fe8;
    width: 0%;
}

#quest {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 260px;
    padding: 12px;
    background: rgba(0,0,0,.65);
    border-radius: 8px;
}

#dialogue {
    position: absolute;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%);
    width: min(700px, 90vw);
    padding: 18px;
    background: rgba(0,0,0,.88);
    border: 2px solid #aaa;
    border-radius: 8px;
    display: none;
}

#dialogueName {
    color: #ffd85c;
    font-weight: bold;
    margin-bottom: 8px;
}

#message {
    line-height: 1.5;
}

#help {
    position: absolute;
    bottom: 12px;
    left: 12px;
    padding: 8px 10px;
    background: rgba(0,0,0,.55);
    border-radius: 5px;
    font-size: 13px;
}

#minimap {
    position: absolute;
    bottom: 15px;
    right: 15px;
    width: 150px;
    height: 150px;
    background: rgba(0,0,0,.65);
    border: 2px solid rgba(255,255,255,.3);
}

#levelup {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    font-weight: bold;
    color: #ffe66d;
    text-shadow: 0 2px 5px black;
    display: none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div id="stats">
        <strong>BLACKWOOD RPG</strong>

        <div>
            HP:
            <span id="hpText">100 / 100</span>
        </div>

        <div class="bar">
            <div id="hpBar"></div>
        </div>

        <div>
            XP:
            <span id="xpText">0 / 100</span>
        </div>

        <div class="bar">
            <div id="xpBar"></div>
        </div>

        <div>
            Level: <span id="levelText">1</span>
        </div>

        <div>
            Coins: <span id="coinsText">0</span>
        </div>
    </div>

    <div id="quest">
        <strong>QUEST</strong>
        <br><br>
        <span id="questText">
            Talk to the village elder.
        </span>
    </div>

    <canvas id="minimap"></canvas>

    <div id="help">
        WASD / Arrows: Move |
        SPACE: Attack |
        E: Interact |
        ENTER: Continue
    </div>

    <div id="dialogue">
        <div id="dialogueName"></div>
        <div id="message"></div>
    </div>

    <div id="levelup">
        LEVEL UP!
    </div>

</div>

<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const minimap = document.getElementById("minimap");
const miniCtx = minimap.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


/* =========================================================
   WORLD
========================================================= */

const TILE = 48;

const MAP_WIDTH = 80;
const MAP_HEIGHT = 60;

const WORLD_WIDTH = MAP_WIDTH * TILE;
const WORLD_HEIGHT = MAP_HEIGHT * TILE;

const tiles = [];

for (let y = 0; y < MAP_HEIGHT; y++) {

    tiles[y] = [];

    for (let x = 0; x < MAP_WIDTH; x++) {

        let tile = "grass";

        const edge =
            x === 0 ||
            y === 0 ||
            x === MAP_WIDTH - 1 ||
            y === MAP_HEIGHT - 1;

        if (edge) {
            tile = "water";
        }

        tiles[y][x] = tile;
    }
}


/* =========================================================
   MAP GENERATION
========================================================= */

function rand(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(rand(min, max + 1));
}


// Water regions
for (let i = 0; i < 12; i++) {

    const cx = randomInt(3, MAP_WIDTH - 4);
    const cy = randomInt(3, MAP_HEIGHT - 4);

    const radius = randomInt(1, 3);

    for (let y = -radius; y <= radius; y++) {
        for (let x = -radius; x <= radius; x++) {

            const tx = cx + x;
            const ty = cy + y;

            if (
                tx > 1 &&
                ty > 1 &&
                tx < MAP_WIDTH - 2 &&
                ty < MAP_HEIGHT - 2 &&
                Math.random() > .25
            ) {
                tiles[ty][tx] = "water";
            }
        }
    }
}


// Dirt paths
for (let x = 3; x < MAP_WIDTH - 3; x++) {

    const y = Math.floor(MAP_HEIGHT / 2);

    tiles[y][x] = "dirt";
    tiles[y + 1][x] = "dirt";
}

for (let y = 3; y < MAP_HEIGHT - 3; y++) {

    const x = Math.floor(MAP_WIDTH / 2);

    tiles[y][x] = "dirt";
    tiles[y][x + 1] = "dirt";
}


// Village clearing
for (let y = 23; y < 35; y++) {

    for (let x = 32; x < 48; x++) {

        tiles[y][x] = "grass";
    }
}


/* =========================================================
   OBJECTS
========================================================= */

const objects = [];

function addObject(type, x, y) {
    objects.push({
        type,
        x: x * TILE + TILE / 2,
        y: y * TILE + TILE / 2
    });
}


// Trees
for (let i = 0; i < 170; i++) {

    const x = randomInt(2, MAP_WIDTH - 3);
    const y = randomInt(2, MAP_HEIGHT - 3);

    if (
        tiles[y][x] === "grass" &&
        !(x > 28 && x < 52 && y > 20 && y < 38)
    ) {
        addObject("tree", x, y);
    }
}


// Rocks
for (let i = 60; i < 100; i++) {

    const x = randomInt(2, MAP_WIDTH - 3);
    const y = randomInt(2, MAP_HEIGHT - 3);

    if (tiles[y][x] === "grass") {
        addObject("rock", x, y);
    }
}


// Village houses
addObject("house", 36, 27);
addObject("house", 43, 27);
addObject("house", 39, 32);


// Chest
addObject("chest", 47, 31);


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 40 * TILE + TILE / 2,
    y: 30 * TILE + TILE / 2,

    radius: 15,

    speed: 190,

    hp: 100,
    maxHp: 100,

    level: 1,

    xp: 0,
    xpNeeded: 100,

    coins: 0,

    attackCooldown: 0,
    attackTimer: 0,

    invincible: 0,

    direction: {
        x: 0,
        y: 1
    }
};


/* =========================================================
   NPC
========================================================= */

const elder = {

    x: 38 * TILE + TILE / 2,
    y: 30 * TILE + TILE / 2,

    name: "Elder Rowan",

    dialogue:
        "The forest has become dangerous. Defeat five shadow creatures and return to me."
};


/* =========================================================
   ENEMIES
========================================================= */

const enemies = [];

function spawnEnemy(x, y) {

    enemies.push({

        x: x * TILE + TILE / 2,
        y: y * TILE + TILE / 2,

        radius: 15,

        hp: 40,
        maxHp: 40,

        speed: 55,

        damage: 8,

        attackCooldown: 0,

        dead: false
    });
}


for (let i = 0; i < 12; i++) {

    let x;
    let y;

    do {

        x = randomInt(5, MAP_WIDTH - 6);
        y = randomInt(5, MAP_HEIGHT - 6);

    } while (
        Math.abs(x - 40) < 8 &&
        Math.abs(y - 30) < 8
    );

    spawnEnemy(x, y);
}


/* =========================================================
   INPUT
========================================================= */

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (
        e.key === " " ||
        e.key.startsWith("Arrow")
    ) {
        e.preventDefault();
    }

    if (e.key.toLowerCase() === "e") {
        interact();
    }

    if (e.key === " ") {
        attack();
    }

    if (e.key === "Enter") {
        advanceDialogue();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(cx, cy, radius, rx, ry, rw, rh) {

    const nearestX = Math.max(rx, Math.min(cx, rx + rw));
    const nearestY = Math.max(ry, Math.min(cy, ry + rh));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return dx * dx + dy * dy < radius * radius;
}


function blocked(x, y) {

    const tx = Math.floor(x / TILE);
    const ty = Math.floor(y / TILE);

    if (
        tx < 0 ||
        ty < 0 ||
        tx >= MAP_WIDTH ||
        ty >= MAP_HEIGHT
    ) {
        return true;
    }

    if (tiles[ty][tx] === "water") {
        return true;
    }


    for (const object of objects) {

        if (
            object.type === "tree" ||
            object.type === "rock" ||
            object.type === "house"
        ) {

            const size =
                object.type === "house"
                    ? 22
                    : 16;

            if (
                Math.abs(x - object.x) < TILE / 2 &&
                Math.abs(y - object.y) < TILE / 2
            ) {

                if (
                    circleRectCollision(
                        x,
                        y,
                        player.radius,
                        object.x - size,
                        object.y - size,
                        size * 2,
                        size * 2
                    )
                ) {
                    return true;
                }
            }
        }
    }

    return false;
}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(dt) {

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) {
        dy -= 1;
    }

    if (keys["s"] || keys["arrowdown"]) {
        dy += 1;
    }

    if (keys["a"] || keys["arrowleft"]) {
        dx -= 1;
    }

    if (keys["d"] || keys["arrowright"]) {
        dx += 1;
    }

    if (dx !== 0 || dy !== 0) {

        const length = Math.hypot(dx, dy);

        dx /= length;
        dy /= length;

        player.direction.x = dx;
        player.direction.y = dy;

        const nx =
            player.x +
            dx * player.speed * dt;

        const ny =
            player.y +
            dy * player.speed * dt;

        if (!blocked(nx, player.y)) {
            player.x = nx;
        }

        if (!blocked(player.x, ny)) {
            player.y = ny;
        }
    }

    player.attackCooldown =
        Math.max(
            0,
            player.attackCooldown - dt
        );

    player.attackTimer =
        Math.max(
            0,
            player.attackTimer - dt
        );

    player.invincible =
        Math.max(
            0,
            player.invincible - dt
        );
}


/* =========================================================
   COMBAT
========================================================= */

function attack() {

    if (player.attackCooldown > 0) {
        return;
    }

    player.attackCooldown = .35;
    player.attackTimer = .15;

    for (const enemy of enemies) {

        if (enemy.dead) {
            continue;
        }

        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;

        const distance = Math.hypot(dx, dy);

        if (distance < 65) {

            const dot =
                dx * player.direction.x +
                dy * player.direction.y;

            if (dot > -5) {

                enemy.hp -= 25;

                if (enemy.hp <= 0) {

                    enemy.dead = true;

                    player.coins += randomInt(2, 8);

                    gainXP(35);
                }
            }
        }
    }
}


function gainXP(amount) {

    player.xp += amount;

    while (player.xp >= player.xpNeeded) {

        player.xp -= player.xpNeeded;

        player.level++;

        player.xpNeeded =
            Math.floor(player.xpNeeded * 1.35);

        player.maxHp += 20;

        player.hp = player.maxHp;

        showLevelUp();
    }
}


function showLevelUp() {

    const element =
        document.getElementById("levelup");

    element.style.display = "block";

    setTimeout(() => {
        element.style.display = "none";
    }, 1200);
}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt) {

    for (const enemy of enemies) {

        if (enemy.dead) {
            continue;
        }

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;

        const distance = Math.hypot(dx, dy);

        if (distance < 320 && distance > 35) {

            const vx =
                dx / distance;

            const vy =
                dy / distance;

            const nx =
                enemy.x +
                vx * enemy.speed * dt;

            const ny =
                enemy.y +
                vy * enemy.speed * dt;

            if (!blocked(nx, enemy.y)) {
                enemy.x = nx;
            }

            if (!blocked(enemy.x, ny)) {
                enemy.y = ny;
            }
        }

        enemy.attackCooldown =
            Math.max(
                0,
                enemy.attackCooldown - dt
            );

        if (
            distance < 40 &&
            enemy.attackCooldown <= 0
        ) {

            enemy.attackCooldown = 1;

            damagePlayer(enemy.damage);
        }
    }
}


function damagePlayer(amount) {

    if (player.invincible > 0) {
        return;
    }

    player.hp -= amount;

    player.invincible = .7;

    if (player.hp <= 0) {

        player.hp = player.maxHp;

        player.x =
            40 * TILE +
            TILE / 2;

        player.y =
            30 * TILE +
            TILE / 2;

        player.coins =
            Math.max(
                0,
                player.coins - 5
            );
    }
}


/* =========================================================
   QUEST
========================================================= */

let questStarted = false;
let questCompleted = false;
let kills = 0;

function updateQuest() {

    if (!questStarted) {

        document.getElementById("questText").textContent =
            "Talk to the village elder.";

        return;
    }

    if (!questCompleted && kills < 5) {

        document.getElementById("questText").textContent =
            `Defeat shadow creatures: ${kills}/5`;

        return;
    }

    if (!questCompleted) {

        questCompleted = true;

        player.coins += 100;

        gainXP(100);

        document.getElementById("questText").textContent =
            "Quest complete. Return to Elder Rowan.";

        return;
    }

    document.getElementById("questText").textContent =
        "The forest is safer now.";
}


/* =========================================================
   INTERACTION
========================================================= */

let dialogueOpen = false;

function openDialogue(name, text) {

    dialogueOpen = true;

    document.getElementById("dialogueName")
        .textContent = name;

    document.getElementById("message")
        .textContent = text;

    document.getElementById("dialogue")
        .style.display = "block";
}


function closeDialogue() {

    dialogueOpen = false;

    document.getElementById("dialogue")
        .style.display = "none";
}


function advanceDialogue() {

    if (!dialogueOpen) {
        return;
    }

    closeDialogue();
}


function interact() {

    if (dialogueOpen) {
        closeDialogue();
        return;
    }


    // Elder

    if (
        Math.hypot(
            player.x - elder.x,
            player.y - elder.y
        ) < 70
    ) {

        if (!questStarted) {

            questStarted = true;

            openDialogue(
                elder.name,
                elder.dialogue
            );

        } else if (questCompleted) {

            openDialogue(
                elder.name,
                "You have done well. The village owes you a debt."
            );

        } else {

            openDialogue(
                elder.name,
                `You have defeated ${kills} of the five creatures.`
            );
        }

        return;
    }


    // Chest

    for (const object of objects) {

        if (object.type !== "chest") {
            continue;
        }

        if (
            Math.hypot(
                player.x - object.x,
                player.y - object.y
            ) < 60
        ) {

            if (!object.opened) {

                object.opened = true;

                player.coins += 50;

                gainXP(20);

                openDialogue(
                    "Chest",
                    "You found 50 coins and gained experience."
                );

            } else {

                openDialogue(
                    "Chest",
                    "The chest is empty."
                );
            }

            return;
        }
    }
}


/* =========================================================
   CAMERA
========================================================= */

const camera = {
    x: 0,
    y: 0
};

function updateCamera() {

    camera.x =
        player.x -
        canvas.width / 2;

    camera.y =
        player.y -
        canvas.height / 2;

    camera.x =
        Math.max(
            0,
            Math.min(
                camera.x,
                WORLD_WIDTH - canvas.width
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                camera.y,
                WORLD_HEIGHT - canvas.height
            )
        );
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld() {

    const startX =
        Math.floor(camera.x / TILE) - 1;

    const endX =
        Math.ceil(
            (camera.x + canvas.width) / TILE
        ) + 1;

    const startY =
        Math.floor(camera.y / TILE) - 1;

    const endY =
        Math.ceil(
            (camera.y + canvas.height) / TILE
        ) + 1;


    for (
        let y = startY;
        y <= endY;
        y++
    ) {

        for (
            let x = startX;
            x <= endX;
            x++
        ) {

            if (
                x < 0 ||
                y < 0 ||
                x >= MAP_WIDTH ||
                y >= MAP_HEIGHT
            ) {
                continue;
            }

            const tile =
                tiles[y][x];

            const px =
                x * TILE -
                camera.x;

            const py =
                y * TILE -
                camera.y;


            if (tile === "grass") {
                ctx.fillStyle = "#4f8f4a";
            }

            if (tile === "dirt") {
                ctx.fillStyle = "#a88354";
            }

            if (tile === "water") {
                ctx.fillStyle = "#3478a8";
            }

            ctx.fillRect(
                px,
                py,
                TILE,
                TILE
            );


            // grass texture

            if (tile === "grass") {

                ctx.fillStyle =
                    "rgba(255,255,255,.04)";

                ctx.fillRect(
                    px + 10,
                    py + 15,
                    2,
                    8
                );

                ctx.fillRect(
                    px + 30,
                    py + 30,
                    2,
                    6
                );
            }


            // water texture

            if (tile === "water") {

                ctx.strokeStyle =
                    "rgba(255,255,255,.15)";

                ctx.beginPath();

                ctx.moveTo(
                    px + 8,
                    py + 24
                );

                ctx.lineTo(
                    px + 35,
                    py + 24
                );

                ctx.stroke();
            }
        }
    }
}


/* =========================================================
   DRAW OBJECTS
========================================================= */

function drawObjects() {

    for (const object of objects) {

        const x =
            object.x -
            camera.x;

        const y =
            object.y -
            camera.y;


        if (
            x < -60 ||
            y < -60 ||
            x > canvas.width + 60 ||
            y > canvas.height + 60
        ) {
            continue;
        }


        if (object.type === "tree") {

            ctx.fillStyle = "#5b3925";

            ctx.fillRect(
                x - 7,
                y,
                14,
                27
            );

            ctx.fillStyle = "#194d2c";

            ctx.beginPath();

            ctx.arc(
                x,
                y - 10,
                23,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.fillStyle = "#246b37";

            ctx.beginPath();

            ctx.arc(
                x - 9,
                y - 17,
                15,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        if (object.type === "rock") {

            ctx.fillStyle = "#777";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                15,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        if (object.type === "house") {

            ctx.fillStyle = "#c7a36a";

            ctx.fillRect(
                x - 30,
                y - 24,
                60,
                48
            );

            ctx.fillStyle = "#713c35";

            ctx.beginPath();

            ctx.moveTo(x - 38, y - 24);
            ctx.lineTo(x, y - 52);
            ctx.lineTo(x + 38, y - 24);

            ctx.closePath();

            ctx.fill();

            ctx.fillStyle = "#49352b";

            ctx.fillRect(
                x - 9,
                y,
                18,
                24
            );
        }


        if (object.type === "chest") {

            ctx.fillStyle =
                object.opened
                    ? "#6b4b31"
                    : "#b97928";

            ctx.fillRect(
                x - 18,
                y - 14,
                36,
                28
            );

            ctx.fillStyle = "#ffd34d";

            ctx.fillRect(
                x - 3,
                y - 2,
                6,
                8
            );
        }
    }
}


/* =========================================================
   DRAW NPC
========================================================= */

function drawElder() {

    const x =
        elder.x -
        camera.x;

    const y =
        elder.y -
        camera.y;

    ctx.fillStyle = "#333";

    ctx.fillRect(
        x - 14,
        y,
        28,
        28
    );

    ctx.fillStyle = "#d7a27c";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 17,
        13,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#ddd";

    ctx.font = "14px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        elder.name,
        x,
        y - 38
    );
}


/* =========================================================
   DRAW ENEMIES
========================================================= */

function drawEnemies() {

    for (const enemy of enemies) {

        if (enemy.dead) {
            continue;
        }

        const x =
            enemy.x -
            camera.x;

        const y =
            enemy.y -
            camera.y;

        ctx.fillStyle = "#57215e";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            enemy.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // eyes

        ctx.fillStyle = "#ff4545";

        ctx.fillRect(
            x - 7,
            y - 4,
            4,
            4
        );

        ctx.fillRect(
            x + 3,
            y - 4,
            4,
            4
        );


        // health bar

        ctx.fillStyle = "#222";

        ctx.fillRect(
            x - 18,
            y - 28,
            36,
            5
        );

        ctx.fillStyle = "#e33";

        ctx.fillRect(
            x - 18,
            y - 28,
            36 * (
                enemy.hp /
                enemy.maxHp
            ),
            5
        );
    }
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x =
        player.x -
        camera.x;

    const y =
        player.y -
        camera.y;


    if (
        player.invincible > 0 &&
        Math.floor(
            player.invincible * 12
        ) % 2 === 0
    ) {
        return;
    }


    ctx.fillStyle = "#263f8f";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // face

    ctx.fillStyle = "#e3a17e";

    ctx.beginPath();

    ctx.arc(
        x,
        y - 8,
        10,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // sword

    if (player.attackTimer > 0) {

        ctx.strokeStyle = "#eee";

        ctx.lineWidth = 7;

        ctx.beginPath();

        ctx.moveTo(
            x +
            player.direction.x * 15,
            y +
            player.direction.y * 15
        );

        ctx.lineTo(
            x +
            player.direction.x * 55,
            y +
            player.direction.y * 55
        );

        ctx.stroke();

        ctx.lineWidth = 1;
    }
}


/* =========================================================
   DAY / NIGHT
========================================================= */

let worldTime = 0;

function drawLighting(dt) {

    worldTime += dt;

    const cycle =
        (worldTime % 120) / 120;

    const darkness =
        Math.max(
            0,
            Math.sin(
                cycle * Math.PI * 2
            ) * .25 + .15
        );

    ctx.fillStyle =
        `rgba(10,20,50,${darkness})`;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================================
   MINIMAP
========================================================= */

function drawMinimap() {

    const width =
        minimap.width;

    const height =
        minimap.height;

    miniCtx.clearRect(
        0,
        0,
        width,
        height
    );


    const scaleX =
        width / WORLD_WIDTH;

    const scaleY =
        height / WORLD_HEIGHT;


    for (
        let y = 0;
        y < MAP_HEIGHT;
        y++
    ) {

        for (
            let x = 0;
            x < MAP_WIDTH;
            x++
        ) {

            const tile =
                tiles[y][x];

            if (tile === "grass") {
                miniCtx.fillStyle = "#4f8f4a";
            }

            if (tile === "dirt") {
                miniCtx.fillStyle = "#a88354";
            }

            if (tile === "water") {
                miniCtx.fillStyle = "#3478a8";
            }

            miniCtx.fillRect(
                x * TILE * scaleX,
                y * TILE * scaleY,
                TILE * scaleX + 1,
                TILE * scaleY + 1
            );
        }
    }


    miniCtx.fillStyle = "#fff";

    miniCtx.beginPath();

    miniCtx.arc(
        player.x * scaleX,
        player.y * scaleY,
        3,
        0,
        Math.PI * 2
    );

    miniCtx.fill();


    miniCtx.fillStyle = "#f0c040";

    miniCtx.beginPath();

    miniCtx.arc(
        elder.x * scaleX,
        elder.y * scaleY,
        3,
        0,
        Math.PI * 2
    );

    miniCtx.fill();
}


/* =========================================================
   UI
========================================================= */

function updateUI() {

    document.getElementById("hpText")
        .textContent =
        `${Math.ceil(player.hp)} / ${player.maxHp}`;

    document.getElementById("xpText")
        .textContent =
        `${player.xp} / ${player.xpNeeded}`;

    document.getElementById("levelText")
        .textContent =
        player.level;

    document.getElementById("coinsText")
        .textContent =
        player.coins;

    document.getElementById("hpBar")
        .style.width =
        `${player.hp / player.maxHp * 100}%`;

    document.getElementById("xpBar")
        .style.width =
        `${player.xp / player.xpNeeded * 100}%`;
}


/* =========================================================
   TRACK KILLS
========================================================= */

let previousDeadCount = 0;

function updateKills() {

    const deadCount =
        enemies.filter(
            e => e.dead
        ).length;

    if (deadCount > previousDeadCount) {

        kills +=
            deadCount -
            previousDeadCount;

        previousDeadCount =
            deadCount;
    }
}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(dt) {

    if (!dialogueOpen) {

        updatePlayer(dt);

        updateEnemies(dt);

        updateCamera();

        updateKills();

        updateQuest();
    }

    updateUI();
}


/* =========================================================
   MAIN DRAW
========================================================= */

function draw(dt) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();

    drawObjects();

    drawEnemies();

    drawElder();

    drawPlayer();

    drawLighting(dt);

    drawMinimap();
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime = performance.now();

function gameLoop(now) {

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            .05
        );

    lastTime = now;

    update(dt);

    draw(dt);

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
